name: Keep demo warm
# Render's free tier sleeps after 15 minutes idle; ping the health endpoint so judges never hit a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://clearcut-yy14.onrender.com/healthz
